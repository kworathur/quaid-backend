openapi: 3.1.0
info:
  title: Background Checks API
  description: |-
    Background checks API for quaid.ai - verify legitimacy of admissions and financial aid applications.

  version: 0.1.0
servers:
  - url: https://api.quaid-ai.com
tags:
  - name: student
    description: Student data import and queries
  - name: check
    description: Background checks on student and their financial aid applications.
paths:
  /students:
    get:
      tags:
        - student
      summary: Get a paginated list of students
      operationId: listStudents
      parameters:
        - in: query
          name: offset
          description: offset for retreiving search results
          required: false
          schema:
            type: integer
            format: int64
            example: 5
            minimum: 0

        - in: query
          name: limit
          description: number of results per page
          required: false
          schema:
            type: integer
            format: int64
            example: 25
            minimum: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/requestBodies/Student'
                  pagination:
                    type: object
                    properties:
                      offset:
                        type: number
                        description: the offset passed in query parameters for this request.
                        required: true
                      limit:
                        type: number
                        description: the limit passed in the query parameters for this request.
                        required: true
                      totalItems:
                        type: number
                        description: the total number of items matching this query
                        required: true
                      totalPages:
                        type: number
                        description: the total number of pages matching this query
                        required: true
                      currentPage:
                        type: number
                        description:
                        schema:
                          type: integer
                          format: int64
                          example: 5
                          minimum: 1

        #                 "pagination": {
        #   "offset": 20,
        #   "limit": 10,
        #   "totalItems": 5000, // Total number of items available
        #   "totalPages": 500, // Calculated as ceil(totalItems / limit)
        #   "currentPage": 3 // Calculated as (offset / limit) + 1
        # },
        # "links": { // HATEOAS links for navigation
        #   "self": "/items?offset=20&limit=10",
        #   "first": "/items?offset=0&limit=10",
        #   "prev": "/items?offset=10&limit=10", // Null if on the first page
        #   "next": "/items?offset=30&limit=10", // Null if on the last page
        #   "last": "/items?offset=4990&limit=10"
        # }
        # prev:
        #   type: string
        #   description: URI of previous page of results
        # next:
        #   type: string
        #   description: URI of next page of results

        '400':
          description: Invalid ID supplied
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - api_auth:
            - write:students
            - read:students

  /students/findByEmail:
    get:
      tags:
        - student
      summary: Find a student by email
      description: Multiple status values can be provided with comma separated strings.
      operationId: findstudentsByStatus
      parameters:
        - in: query
          name: email
          description: Email of the student to retrieve
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/requestBodies/Student'
        '404':
          description: Student with provided email not found

        '400':
          description: Missing query parameter 'email'

        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - api_auth:
            - write:students
            - read:students
  /students/{studentId}:
    get:
      tags:
        - student
      summary: Find student by identifier.
      description: Returns a single student.
      operationId: getStudentById
      parameters:
        - name: studentId
          in: path
          description: ID of student to return
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/requestBodies/Student'
        '404':
          description: Student not found with provided ID
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - api_key: []
        - api_auth:
            - write:students
            - read:students
    put:
      tags:
        - student
      summary: Updates a student with form data.
      description: update a student's verification status with form data.
      operationId: updateStudentWithForm
      parameters:
        - name: studentId
          in: path
          description: ID of student that needs to be updated
          required: true
          schema:
            type: integer
            format: int64

      responses:
        '200':
          description: successfully updated
        '400':
          description: Invalid input
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - api_auth:
            - write:students
            - read:students
    delete:
      tags:
        - pet
      summary: Deletes a pet.
      description: delete a pet.
      operationId: deletePet
      parameters:
        - name: api_key
          in: header
          description: ''
          required: false
          schema:
            type: string
        - name: petId
          in: path
          description: Pet id to delete
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: successful operation
        '400':
          description: Invalid pet value
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - api_auth:
            - write:students
            - read:students
  /students/{studentId}/verifyEmail:
    post:
      tags:
        - pet
      summary: Send a verification email to a student.
      description: Sends a verification email to a student with a six-digit code.
      operationId: verifyEmail
      parameters:
        - name: petId
          in: path
          description: ID of pet to update
          required: true
          schema:
            type: integer
            format: int64
        - name: additionalMetadata
          in: query
          description: Additional Metadata
          required: false
          schema:
            type: string
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - api_auth:
            - write:students
            - read:students

components:
  schemas:
    Student:
      required:
        - email
        - address
        - birthdate
        - name
        - level_of_study
      type: object
      properties:
        email:
          type: string
          examples: [kworathur3@gatech.edu]
        address:
          type: string
          examples: ['123 Cherry St., Atlanta GA, 30309']
        birthdate:
          type: string
          examples: ['2002-04-12']
        level_of_study:
          type: string
          description: student level of study
          enum:
            - BACHELORS
            - MASTERS
            - DOCTORAL
    ApiResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        type:
          type: string
        message:
          type: string
    Error:
      type: object
      properties:
        message:
          type: string
          description: A description of the error
      required:
        - code
        - message
  requestBodies:
    Student:
      description: Students for running background checks on
      content:
        application/json:
          schema:
            $ref: '#/components/requestBodies/Student'
    StudentArray:
      description: List of student objects
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/requestBodies/Student'
  securitySchemes:
    api_auth:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://user-pool-domain-705948898164.auth.us-east-1.amazoncognito.com/oauth2/authorize
          scopes:
            'write:students': modify students in your account
            'read:students': read your students
    # api_key:
    #   type: apiKey
    #   name: api_key
    #   in: header
