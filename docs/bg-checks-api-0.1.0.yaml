openapi: 3.1.0
info:
  title: Background Checks API
  description: |-
    Verify that college applications and need-based aid applications come from real students - not 
    bad actors. 

    Features:
      - Integrates with all major student information systems (SIS)
      - Request-based pricing model
      - Detect fraud in Free Application for Federal Student Aid (FAFSA) applications
      - Integrate with student resources in SIS to automatically place holds on registration
      - Uses multiple datapoints for background checks - address liveness, program of study sanity checks, ML-model scoring
  version: 0.1.0
security:
  - oauth2Profiles:
      - students:write
      - students:read
servers:
  - url: https://api.quaid-ai.com
tags:
  - name: student
    description: Student metadata for recording student liveness, fraud likelihood
  - name: applications
    description: An need-based financial aid application for a student
  - name: check
    description: Background checks on students and their financial aid applications.
  - name: advising
    description: Advising appointments booking
paths:
  /students:
    get:
      tags:
        - student
      summary: Get a paginated list of students
      operationId: listStudents
      description: Implementation note - later this operation will call SIS APIs for reading student data, for now query data in DynamoDB
      parameters:
        - in: query
          name: offset
          description: offset for retreiving search results
          required: false
          schema:
            type: integer
            format: int64
            example: 5
            minimum: 0

        - in: query
          name: limit
          description: number of results per page
          required: false
          schema:
            type: integer
            format: int64
            example: 25
            minimum: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MockStudent'
                  pagination:
                    $ref: '#/components/schemas/PaginationParams'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
        '400':
          description: offset out of bounds
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - student
      summary: Create a new student
      operationId: createNewStudent
      requestBody:
        content:
          application/octet-stream:
            schema:
              $ref: '#/components/schemas/MockStudent'

      responses:
        '200':
          description: New student created succesfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseApiResponse'
              example:
                status: 'success'
                statusCode: 200
                message: '/students/55'
        '400':
          description: invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                AddressMistmach:
                  value:
                    status: 'error'
                    statusCode: 400
                    error:
                      code: BAD_REQUEST
                      message: Level of study CONTINUING_STUDENT is not valid
        '409':
          description: student with this email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                AddressMistmach:
                  value:
                    status: 'error'
                    statusCode: 409
                    error:
                      code: CONFLICT
                      message: A student with this email address already exists
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /students/findByEmail:
    get:
      tags:
        - student
      summary: Find a student by email
      description: Implementation note - currently queries students in DynamoDB, eventually should query data with banner/other SIS APIs
      operationId: findstudentsByEmail
      parameters:
        - in: query
          name: email
          required: true
          description: Email of the student to retrieve
          schema:
            example: kworathur3@gatech.edu

      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MockStudent'
        '404':
          description: Student with provided email not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Missing query parameter 'email'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /students/{studentId}:
    get:
      tags:
        - student
      summary: Find student by identifier.
      description: Returns a single student.
      operationId: getStudentById
      parameters:
        - name: studentId
          in: path
          description: ID of student to return
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MockStudent'
        '404':
          description: Student not found with provided ID
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - student
      summary: Update a student's verification status
      description: update a student's verification status with form data and place a hold on the student's registration if student marked as fraudulent
      operationId: updateStudentWithForm
      requestBody:
        description: Update a student's status from UNVERIFIED to VERIFIED
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  description: The new verification status of the student
                  $ref: '#/components/schemas/VerficationStatus'
            example:
              status: VERIFIED
      parameters:
        - name: studentId
          in: path
          description: ID of student that needs to be updated
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: successfully updated student status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseApiResponse'
              example:
                status: 'success'
                statusCode: 200
                message: 'Successfully updated student(id:55) status from UNVERIFIED to VERIFIED'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Student ID not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /students/{studentId}/confirmConsent:
    post:
      tags:
        - student
      summary: Confirm a student's consent to background checks.
      operationId: confirmStudentConsent
      parameters:
        - name: studentId
          in: path
          description: ID of student to update
          required: true
          schema:
            type: integer
            format: int64
            example: 55
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: object
              properties:
                consentStatus:
                  type: boolean
              required:
                - consentStatus
            example:
              consentStatus: true
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseApiResponse'
              example:
                status: 'success'
                statusCode: 200
                message: 'Student has consented to background checks'
        '400':
          description: student has already consented to background checks
        '404':
          description: student with provided ID not found
        default:
          description: default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /students/{studentId}/checks:
    get:
      tags:
        - check
      summary: get a list of completed and in progress checks for a student
      operationId: getChecks
      parameters:
        - name: studentId
          in: path
          description: ID of student to perform an inquiry against
          required: true
          schema:
            type: integer
            format: int64
            example: 55

  /students/{studentId}/checks/addressLiveness:
    post:
      tags:
        - check
      summary: Start an address liveness inquiry for a student.
      operationId: checkAddressLiveness
      parameters:
        - name: studentId
          in: path
          description: ID of student to perform an inquiry against
          required: true
          schema:
            type: integer
            format: int64
            example: 55

      responses:
        '200':
          description: Inquiry is being processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseApiResponse'
              example:
                status: 'success'
                statusCode: 200
                message: '24a0d969-f8f3-4a7b-b685-f25343caefad'
        '400':
          description: invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                StudentDidNotConsent:
                  value:
                    status: 'error'
                    statusCode: 400
                    error:
                      code: BAD_REQUEST
                      message: Student did not consent to background checks
                AddressMistmach:
                  value:
                    status: 'error'
                    statusCode: 400
                    error:
                      code: BAD_REQUEST
                      message: Student's address in students table does not match address on FAFSA application
        '404':
          description: student with provided ID not found
        '409':
          description: an address liveness check for this student is already in the queue
        default:
          description: default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /students/{studentId}/checks/postSanityChecks:
    post:
      tags:
        - check
      summary: Perform a sanity check of a student's program of study based on a student's age.
      description: Updates postSanityCheck indicator in indicators. Note that this sanity check is implemented synchronously.
      operationId: postSanityChecks
      parameters:
        - name: studentId
          in: path
          description: ID of student to perform a sanity check against
          required: true
          schema:
            type: integer
            format: int64
            example: 55

      responses:
        '200':
          description: Sanity check complete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseApiResponse'
              example:
                status: 'success'
                statusCode: 200
                message: 'Program of study sanity check complete'

        '400':
          description: invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                StudentDidNotConsent:
                  value:
                    status: 'error'
                    statusCode: 400
                    error:
                      code: BAD_REQUEST
                      message: Student did not consent to background checks
        '404':
          description: student with provided ID not found
        '409':
          description: a program of study sanity check for this student has already been completed. Delete the check and try again.
        default:
          description: default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /students/{studentId}/checks/investigateAttendance:
    post:
      tags:
        - check
      summary: Calculate attendance rate and class participation for a student.
      description: Substitutes data from learning management systems and piazza with synthetic data
      operationId: investigateAttendance
      parameters:
        - name: studentId
          in: path
          description: ID of student to perform an inquiry against
          required: true
          schema:
            type: integer
            format: int64
            example: 55

      responses:
        '200':
          description: Inquiry is being processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseApiResponse'
              example:
                status: 'success'
                statusCode: 200
                message: '24a0d969-f8f3-4a7b-b685-f25343caefad'
        '400':
          description: invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                StudentDidNotConsent:
                  value:
                    status: 'error'
                    statusCode: 400
                    error:
                      code: BAD_REQUEST
                      message: Student did not consent to background checks
                AddressMistmach:
                  value:
                    status: 'error'
                    statusCode: 400
                    error:
                      code: BAD_REQUEST
                      message: Student's address in students table does not match address on FAFSA application
        '404':
          description: student with provided ID not found
        '409':
          description: an address liveness check for this student is already in the queue
        default:
          description: default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /students/{studentId}/checks/blackListSSNs:
    post:
      tags:
        - check
      summary: Check if a student's SSN appears in a list of blacklisted SSNs.
      operationId: blackListSSNs
      parameters:
        - name: studentId
          in: path
          description: ID of student to perform an inquiry against
          required: true
          schema:
            type: integer
            format: int64
            example: 55

      responses:
        '200':
          description: Inquiry is being processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseApiResponse'
              example:
                status: 'success'
                statusCode: 200
                message: '24a0d969-f8f3-4a7b-b685-f25343caefad'
        '400':
          description: invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                StudentDidNotConsent:
                  value:
                    status: 'error'
                    statusCode: 400
                    error:
                      code: BAD_REQUEST
                      message: Student did not consent to background checks
                AddressMistmach:
                  value:
                    status: 'error'
                    statusCode: 400
                    error:
                      code: BAD_REQUEST
                      message: An SSN has not been provided for this student
        '404':
          description: student with provided ID not found
        '409':
          description: an address liveness check for this student is already in the queue
        default:
          description: default error template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /students/{studentId}/checks/{checkId}/status:
    get:
      tags:
        - check
      summary: Get the status of a background check.
      operationId: checkTaskStatus
      parameters:
        - name: studentId
          in: path
          description: ID of student to update
          required: true
          schema:
            type: integer
            format: int64
            example: 55
        - name: checkId
          in: path
          description: ID of check to update
          required: true
          schema:
            type: integer
            format: int64
            example: 100
      responses:
        '200':
          description: Task status returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseApiResponse'
              example:
                status: 'success'
                statusCode: 200
                message: 'IN_PROGRESS'
        '404':
          description: task with provided ID not found
        default:
          description: default error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /students/{studentId}/applications:
    post:
      tags:
        - applications
      summary: Create a new financial aid application for a student
      operationId: createNewApplication
      parameters:
        - name: studentId
          in: path
          description: ID of student to update
          required: true
          schema:
            type: integer
            format: int64
            example: 55
      requestBody:
        content:
          application/octet-stream:
            schema:
              $ref: '#/components/schemas/MockFinancialAidApp'
            example:
              fafsa_id: 8911122
              last_name: Worathur
              first_name: Keshav
              middle_initial: V
              street_address: '123 Cherry St. NW'
              city: Atlanta
              mailing_state: GA
              zip_code: 30309
              social_security_number: 123456789
              date_of_birth: '2026-01-20'
              high_school_name: Reedy
              high_school_city: Frisco
              high_school_state: TX
              students_income: 0
              parents_income: 120000
              parents_cash_savings_and_checking: 50000
              students_number_of_family_members: 4
              students_number_in_college: 2
              housing_plans: 'off-campus'
              date_completed: '2020-05-01'
              parents_asset_threshold_exceeded: 'N'
              appid: 1234

  /advising/admin/config:
    get:
      tags:
        - advising
      summary: retrieve the value of a flag in the application's global config for advising.
      operationId: getConfig
      responses:
        '200':
          description: Task status returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvisingSystemConfig'
              examples:
                UpdateSuccess:
                  value:
                    configKey: 'ADVISING_PAUSED'
                    value: false
                    reason: 'registration for phase I now open'
    put:
      tags:
        - advising
      summary: Update the value of a flag in the application's global config for advising.
      operationId: updateConfig
      requestBody:
        content:
          application/json:
            example:
              value: ADVISING_PAUSED
              reason: Registration now open
      responses:
        '200':
          description: Advising configuration updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseApiResponse'
              examples:
                AdvisingPaused:
                  value:
                    status: UPDATED
                    statusCode: 200
                    message:
                      message: 'Advising paused'
                      configKey: 'ADVISING_PAUSED'
                      value: true
        '400':
          description: bad request - advising key not defined for this environment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: this key does cannot be updated or does not exist
        default:
          description: unexpected application error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /advising/admin/rules:
    get:
      tags:
        - advising
      summary: list all rules for assigning advisors to students
      operationId: getRules
      responses:
        '200':
          description: Returned all advising-student mapping rules successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdvisingRule'
                  pagination:
                    $ref: '#/components/schemas/PaginationParams'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
        '400':
          description: failed to list all advisor-advisee mappings

    post:
      tags:
        - advising
      summary: create a new rule for assigning advisors to students
      operationId: createAdvisingRule
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdvisingRule'
      responses:
        '200':
          description: advisor-advisee mapping rule was created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseApiResponse'
              example:
                status: CREATED
                statusCode: 200
                message:
                  message: the advising rule mapping students with last names in A-Z to advisor 4 was added successfully.
        '400':
          description: advisor-advisee mapping is malformed
          content:
            application/json:
              examples:
                InvalidAdvisor:
                  value:
                    message: an advisor with ID 4 does not exist

  /advising/admin/rules/{ruleId}:
    put:
      tags:
        - advising
      summary: Update an advisor-advisee mapping.
      description: update the condition type, parameters, or priority of an advising rule
      operationId: updateAdvisingRule
      parameters:
        - name: ruleId
          in: path
          description: ID of the advising rule to update
          required: true
          schema:
            type: number
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAdvisingRule'
            example:
              - conditionType: PROGRAM_OF_STUDY
      responses:
        '200':
          description: successfully updated mapping of advisor to students.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseApiResponse'
              example:
                status: UPDATED
                statusCode: 200
                message: mapping updated successfully.
        '400':
          description: malformed advisor-advisee mapping.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                InvalidConditionType:
                  value:
                    code: BAD_REQUEST
                    data: invalid conditionType DATE_OF_BIRTH

  /advising/advisor: {}

  /advising/availability/{advisorId}: {}

  /advising/bookings/{bookingId}: {}

  /advising/insights/{insightId}: {}

  /advising/insights/execute: {}

  /advising/sessions: {}

  /degreeworks/setup: {}

components:
  schemas:
    # MockStudent is a placeholder for student data that will later be accessed via SIS
    # connectors/ REST APIs
    PaginationParams:
      type: object
      properties:
        offset:
          type: integer
          description: the offset passed in query parameters for this request.
          example: 5
        limit:
          type: integer
          description: the limit passed in the query parameters for this request.
          example: 25
        currentPage:
          type: integer
          description: the current page of search results
          example: 3
          minimum: 1
    PaginationLinks:
      type: object
      description: HATEOAS links to first, previous, next, and last pages
      required:
        - self
        - prev
        - next
      properties:
        self:
          type: string
          example: /items?offset=20&limit=10
        prev:
          type: string
          example: /items?offset=10&limit=10
        next:
          type: string
          example: /items?offset=30&limit=10
    VerficationStatus:
      type: string
      default: UNVERIFIED
      enum:
        - UNVERIFIED
        - VERIFIED
        - NEEDS_REVIEW
        - FRAUDULENT

    MockFinancialAidApp:
      type: object
      description: Financial aid data is populated from Institutional Student Information Record (ISIR)s
      properties:
        fafsa_id:
          type: string
        last_name:
          type: string
        first_name:
          type: string
        middle_initial:
          type: string
        street_address:
          type: string
        city:
          type: string
        mailing_state:
          type: string
        zip_code:
          type: string
        social_security_number:
          type: string
          pattern: /^[0-9]{9}$/
        date_of_birth:
          type: string
        high_school_name:
          type: string
        high_school_city:
          type: string
        high_school_state:
          type: string
        students_income:
          type: integer
        parents_income:
          type: integer
        parents_cash_savings_and_checking:
          type: integer
        students_number_of_family_members:
          type: integer
        students_number_in_college:
          type: integer
        housing_plans:
          type: string
        date_completed:
          type: string
        parents_asset_threshold_exceeded:
          type: boolean
        appid:
          type: integer
    MockStudent:
      required:
        - email
        - address
        - birthdate
        - level_of_study
      type: object
      properties:
        studentId:
          type: integer
          description: Student's unique identifier (Implementation note- currently generated in DynamoDB, later will be foreign keys to SIS database)
        email:
          type: string
          examples: [kworathur3@gatech.edu]
        address:
          type: string
          examples: ['123 Cherry St., Atlanta GA, 30309']
        birthdate:
          type: string
          examples: ['2002-04-12']
        level_of_study:
          type: string
          description: student level of study
          example: BACHELORS
          enum:
            - BACHELORS
            - MASTERS
            - DOCTORAL
        verificationStatus:
          $schema: $ref '#/components/schemas/VerificationStatus'
        consented:
          type: boolean
    AdvisingSystemConfig:
      type: object
      properties:
        configKey:
          type: string
          description: value of the flag to update
          example: 'ADVISING_PAUSED'
        value:
          type: boolean
          description: value of the new flag
        reason:
          type: string
          description: reason for updating the flag
          example: registration for phase I now open

      required:
        - configKey
        - value
        - reason
    Advisor:
      required:
        - email
        - address
        - birthdate
        - level_of_study
      type: object
      properties:
        studentId:
          type: integer
          description: Student's unique identifier (Implementation note- currently generated in DynamoDB, later will be foreign keys to SIS database)
        email:
          type: string
          examples: [kworathur3@gatech.edu]
        address:
          type: string
          examples: ['123 Cherry St., Atlanta GA, 30309']
        birthdate:
          type: string
          examples: ['2002-04-12']
        level_of_study:
          type: string
          description: student level of study
          example: BACHELORS
          enum:
            - BACHELORS
            - MASTERS
            - DOCTORAL
        verificationStatus:
          $schema: $ref '#/components/schemas/VerificationStatus'
        consented:
          type: boolean

    AdvisingRule:
      type: object
      required:
        - advisorId
      properties:
        advisorId:
          type: number
          description: the advisor's ID
          example: 12345
        conditionType:
          type: string
          description: Type of condition used for assigning advisors to students (e.g. range condition).
          enum:
            - LAST_NAME_RANGE
        parameters:
          type: object
          description: list of the parameters used to execute the mapping and their corresponding values
          example:
            { students.last_name: 'string', students.year_of_study: 'number' }
        priority:
          type: number
          description: priority for evaluating the rule. A lower number indicates a higher priority
          minimum: 1
        isActive:
          type: boolean
          description: whether or not the advising mapping is active.

    UpdateAdvisingRule:
      type: object
      required:
        - conditionType
        - parameters
        - priority
        - isActive
      allOf:
        - $ref: '#/components/schemas/AdvisingRule'

    AdvisingInsight:
      required:
        - insightName
        - columns
        - expression
        - messageTemplate
      type: object
      properties:
        insightName:
          type: string
          description: The name of the insight (e.g. suggested_threads)
        columns:
          type: string
          description: Columns in Banner Degree works used to compute the insight
        expression:
          type: string
          enum:
