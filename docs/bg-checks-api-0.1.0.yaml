          $ref: '#/components/schemas/Status'
        statusCode:
          $ref: '#/components/schemas/StatusCode'
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: RESOURCE_NOT_FOUND
              enum:
                - RESOURCE_NOT_FOUND
                - BAD_REQUEST
                - INTERNAL_SEVER_ERROR
            message:
              type: string
              example: The requested resource was not found.
            details:
              type: string
              example: The student with the ID '12345' does not exist in your SIS.
            timestamp:
              type: string
              example: '2023-12-08T12:30:45Z'
            path:
              type: string
              example: /v1/students/55
            suggestion:
              type: string
              example: Please check if the student ID is correct or refer to the documentation at https://api.quaid-ai.com/docs
        requestId:
          type: string
        documentationUrl:
          type: string
      required:
