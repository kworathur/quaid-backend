# This is the SAM template that represents the architecture of your serverless application
# https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/serverless-sam-template-basics.html

# The AWSTemplateFormatVersion identifies the capabilities of the template
# https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/format-version-structure.html
AWSTemplateFormatVersion: 2010-09-09
Description: bg-checks-api

# Transform section specifies one or more macros that AWS CloudFormation uses to process your template
# https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/transform-section-structure.html
Transform:
  - AWS::Serverless-2016-10-31

Parameters:
  Email:
    Type: String
  CallbackUrl:
    Type: String
  CertificateArn:
    Type: String
    Default: ''
    Description: ARN of SSL/TLS certificate in Amazon Certificate Manager (ensure that cert is valid for the region in which resources are deployed)
  EnvironmentType:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod
  MelissaApiKeyParameterName:
    Type: String
    Default: quaid/melissa-api-key
    Description: SSM Parameter Store name for Melissa API key (without leading /)
Conditions:
  IsProd: !Equals [!Ref EnvironmentType, 'prod']

# Resources declares the AWS resources that you want to include in the stack
# https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/resources-section-structure.html

Resources:
  CognitoAuthorizerUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub ${AWS::StackName}-userpool
      LambdaConfig:
        PreTokenGeneration: !GetAtt advisingPreTokenFunction.Arn
        PreTokenGenerationConfig:
          LambdaArn: !GetAtt advisingPreTokenFunction.Arn
          LambdaVersion: V2_0
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete

  CognitoAuthorizerUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: CognitoAuthorizerUserPoolResourceServer
    Properties:
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AllowedOAuthFlows:
        - code
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - email
        - openid
        - profile
        - com.apigw/advising.student
        - com.apigw/advising.advisor
        - com.apigw/advising.admin
      CallbackURLs:
        - !Ref CallbackUrl
        - http://localhost:3000/api/auth/callback/cognito
        - !If
          - IsProd
          - https://demo.quaid-ai.com/api/auth/callback/cognito
          - https://dev-demo.quaid-ai.com/api/auth/callback/cognito
      LogoutURLs:
        - http://localhost:3000/login
        - !If
          - IsProd
          - https://demo.quaid-ai.com/login
          - https://dev-demo.quaid-ai.com/login
      ClientName: !Sub ${AWS::StackName}-client
      SupportedIdentityProviders:
        - COGNITO
      UserPoolId: !Ref CognitoAuthorizerUserPool

  CognitoAuthorizerUserPoolUser:
    Type: AWS::Cognito::UserPoolUser
    Properties:
      UserAttributes:
        - Name: email
          Value: !Ref Email
      Username: !Ref Email
      UserPoolId: !Ref CognitoAuthorizerUserPool

  CognitoAuthorizerUserPoolResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      Identifier: com.apigw
      Name: com.apigw
      Scopes:
        - ScopeDescription: scope_description
          ScopeName: scope1
        - ScopeDescription: Student advising scope
          ScopeName: advising.student
        - ScopeDescription: Advisor advising scope
          ScopeName: advising.advisor
        - ScopeDescription: Admin advising scope
          ScopeName: advising.admin
      UserPoolId: !Ref CognitoAuthorizerUserPool

  CognitoAuthorizerUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub ${AWS::StackName}-${AWS::AccountId}
      UserPoolId: !Ref CognitoAuthorizerUserPool

  CognitoM2MClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: CognitoAuthorizerUserPoolResourceServer
    Properties:
      ClientName: cognito-m2m-integration-test-client
      UserPoolId: !Ref CognitoAuthorizerUserPool
      GenerateSecret: true
      AllowedOAuthFlows:
        - client_credentials
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - com.apigw/scope1
      SupportedIdentityProviders:
        - COGNITO

  BackgroundChecksAPI:
    Type: AWS::Serverless::Api
    Properties:
      Description: Background checks API for quaid.ai - verify legitimacy of admissions and financial aid applications.
      StageName: v1
      DisableExecuteApiEndpoint: !If [IsProd, true, false]
      Auth:
        DefaultAuthorizer: MyCognitoAuth
        Authorizers:
          MyCognitoAuth:
            UserPoolArn: !GetAtt CognitoAuthorizerUserPool.Arn
            AuthorizationScopes:
              - com.apigw/scope1
              - com.apigw/advising.student
              - com.apigw/advising.advisor
              - com.apigw/advising.admin
  CustomDomain:
    Type: AWS::ApiGateway::DomainName
    Condition: IsProd
    Properties:
      CertificateArn: !Ref CertificateArn
      DomainName: api.quaid-ai.com

  BaseMapping:
    Type: 'AWS::ApiGateway::BasePathMapping'
    Condition: IsProd
    Properties:
      DomainName: !Ref CustomDomain
      RestApiId: !Ref BackgroundChecksAPI
      Stage: v1

  # Each Lambda function is defined by properties:
  # https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction

  crudStudentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/students/
      Handler: index.handler
      Runtime: nodejs20.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 100
      Description: Create, read, update and delete student data.
      Policies:
        # Give Create/Read/Update/Delete Permissions to the StudentsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref StudentsTable
        # Give permissions to the CounterTable for auto-increment IDs
        - DynamoDBCrudPolicy:
            TableName: !Ref CounterTable
      Environment:
        Variables:
          # Make table name accessible as environment variable from function code during execution
          STUDENTS_TABLE: !Ref StudentsTable
          COUNTER_TABLE: !Ref CounterTable
      Events:
        Create:
          Type: Api
          Properties:
            Path: /students
            Method: POST
            RestApiId: !Ref BackgroundChecksAPI

        Read:
          Type: Api
          Properties:
            Path: /students
            Method: GET
            RestApiId: !Ref BackgroundChecksAPI

    Metadata: # Manage esbuild properties
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: 'es2020'
        Sourcemap: true

  studentByIdFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/students/_id/
      Handler: index.handler
      Runtime: nodejs20.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 100
      Description: Get and update individual student by ID.
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref StudentsTable
      Environment:
        Variables:
          STUDENTS_TABLE: !Ref StudentsTable
      Events:
        GetById:
          Type: Api
          Properties:
            Path: /students/{studentId}
            Method: GET
            RestApiId: !Ref BackgroundChecksAPI

        UpdateStatus:
          Type: Api
          Properties:
            Path: /students/{studentId}
            Method: PUT
            RestApiId: !Ref BackgroundChecksAPI

    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: 'es2020'
        Sourcemap: true

  confirmConsentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/students/_id/confirmConsent/
      Handler: index.handler
      Runtime: nodejs20.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 100
      Description: Confirm a student's consent to background checks.
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref StudentsTable
      Environment:
        Variables:
          STUDENTS_TABLE: !Ref StudentsTable
      Events:
        ConfirmConsent:
          Type: Api
          Properties:
            Path: /students/{studentId}/confirmConsent
            Method: POST
            RestApiId: !Ref BackgroundChecksAPI

    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - index.ts # or index.js if not TS
        Minify: true
        Target: 'es2020'
        Sourcemap: true

  # Lambda function for creating FAFSA applications
  createApplicationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/students/_id/applications/
      Handler: index.handler
      Runtime: nodejs20.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 100
      Description: Create a FAFSA application for a student.
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref StudentsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ApplicationsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CounterTable
      Environment:
        Variables:
          STUDENTS_TABLE: !Ref StudentsTable
          APPLICATIONS_TABLE: !Ref ApplicationsTable
          COUNTER_TABLE: !Ref CounterTable
      Events:
        CreateApplication:
          Type: Api
          Properties:
            Path: /students/{studentId}/applications
            Method: POST
            RestApiId: !Ref BackgroundChecksAPI

    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - index.ts
        Minify: true
        Target: 'es2020'
        Sourcemap: true

  # Lambda function for initiating address liveness checks
  addressLivenessFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/students/_id/checks/addressLiveness/
      Handler: index.handler
      Runtime: nodejs20.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 100
      Description: Initiate an address liveness check for a student.
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref StudentsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ApplicationsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref InquiriesTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt AddressLivenessQueue.QueueName
      Environment:
        Variables:
          STUDENTS_TABLE: !Ref StudentsTable
          APPLICATIONS_TABLE: !Ref ApplicationsTable
          INQUIRIES_TABLE: !Ref InquiriesTable
          ADDRESS_LIVENESS_QUEUE_URL: !Ref AddressLivenessQueue
      Events:
        CreateAddressLivenessCheck:
          Type: Api
          Properties:
            Path: /students/{studentId}/checks/addressLiveness
            Method: POST
            RestApiId: !Ref BackgroundChecksAPI

    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - index.ts
        Minify: true
        Target: 'es2020'
        Sourcemap: true

  # Lambda function for checking inquiry status
  checkStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/students/_id/checks/_checkId/status/
      Handler: index.handler
      Runtime: nodejs20.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 100
      Description: Get the status of a background check inquiry.
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref InquiriesTable
      Environment:
        Variables:
          INQUIRIES_TABLE: !Ref InquiriesTable
      Events:
        GetCheckStatus:
          Type: Api
          Properties:
            Path: /students/{studentId}/checks/{checkId}/status
            Method: GET
            RestApiId: !Ref BackgroundChecksAPI

    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - index.ts
        Minify: true
        Target: 'es2020'
        Sourcemap: true

  # SQS Worker Lambda for processing address liveness checks
  addressLivenessProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/workers/addressLivenessProcessor/
      Handler: index.handler
      Runtime: nodejs20.x
      Architectures:
        - x86_64
      MemorySize: 256
      Timeout: 60
      Description: Process address liveness checks via Melissa API.
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref StudentsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ApplicationsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref InquiriesTable
        - SSMParameterReadPolicy:
            ParameterName: !Ref MelissaApiKeyParameterName
      Environment:
        Variables:
          STUDENTS_TABLE: !Ref StudentsTable
          APPLICATIONS_TABLE: !Ref ApplicationsTable
          INQUIRIES_TABLE: !Ref InquiriesTable
          MELISSA_API_KEY_PARAM: !Sub /${MelissaApiKeyParameterName}
      Events:
        SQSEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt AddressLivenessQueue.Arn
            BatchSize: 1

    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - index.ts
        Minify: true
        Target: 'es2020'
        Sourcemap: true

  # Simple syntax to create a DynamoDB table with a single attribute primary key, more in
  # https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlesssimpletable

  # DynamoDB table to store item: {id: &lt;ID&gt;, name: &lt;NAME&gt;}
  StudentsTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      PrimaryKey:
        Name: id
        Type: Number

  ProfilesTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      PrimaryKey:
        Name: userSub
        Type: String

  CounterTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      PrimaryKey:
        Name: counter
        Type: String

  # DynamoDB table for FAFSA financial aid applications
  ApplicationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      TableName: !Sub ${AWS::StackName}-ApplicationsTable
      AttributeDefinitions:
        - AttributeName: appid
          AttributeType: N
        - AttributeName: studentId
          AttributeType: N
      KeySchema:
        - AttributeName: appid
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: studentId-index
          KeySchema:
            - AttributeName: studentId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # DynamoDB table for background check inquiries
  InquiriesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      TableName: !Sub ${AWS::StackName}-InquiriesTable
      AttributeDefinitions:
        - AttributeName: inquiryId
          AttributeType: S
        - AttributeName: studentId
          AttributeType: N
        - AttributeName: status
          AttributeType: S
      KeySchema:
        - AttributeName: inquiryId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: studentId-status-index
          KeySchema:
            - AttributeName: studentId
              KeyType: HASH
            - AttributeName: status
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # SQS Dead Letter Queue for failed address liveness checks
  AddressLivenessDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-AddressLivenessDLQ
      MessageRetentionPeriod: 1209600 # 14 days

  # SQS Queue for address liveness check processing
  AddressLivenessQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-AddressLivenessQueue
      VisibilityTimeout: 60
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt AddressLivenessDeadLetterQueue.Arn
        maxReceiveCount: 3

  # ── Advising Feature ─────────────────────────────────────────────────────────

  # Cognito Groups
  AdvisingStudentGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: advising-student
      Description: Enrolled students using the advising feature
      UserPoolId: !Ref CognitoAuthorizerUserPool

  AdvisingAdvisorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: advising-advisor
      Description: Academic advisors
      UserPoolId: !Ref CognitoAuthorizerUserPool

  AdvisingAdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: advising-admin
      Description: System administrators for advising
      UserPoolId: !Ref CognitoAuthorizerUserPool

  # Permission for Cognito to invoke the pre-token generation Lambda
  AdvisingPreTokenLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt advisingPreTokenFunction.Arn
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt CognitoAuthorizerUserPool.Arn

  # Pre-token generation Lambda (must exist before UserPool references it via DependsOn)
  advisingPreTokenFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/cognito/preTokenGeneration/
      Handler: index.handler
      Runtime: nodejs20.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 10
      Description: Inject advising resource-server scopes into Cognito JWT tokens.
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - index.ts
        Minify: true
        Target: 'es2020'
        Sourcemap: true

  # DynamoDB Tables
  AdvisingSlotsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      TableName: !Sub ${AWS::StackName}-AdvisingSlotsTable
      AttributeDefinitions:
        - AttributeName: slotId
          AttributeType: S
        - AttributeName: advisorId
          AttributeType: S
        - AttributeName: slotDateTime
          AttributeType: S
        - AttributeName: studentId
          AttributeType: N
      KeySchema:
        - AttributeName: slotId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: advisorId-slotDateTime-index
          KeySchema:
            - AttributeName: advisorId
              KeyType: HASH
            - AttributeName: slotDateTime
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: studentId-slotDateTime-index
          KeySchema:
            - AttributeName: studentId
              KeyType: HASH
            - AttributeName: slotDateTime
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  AdvisingInsightsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      TableName: !Sub ${AWS::StackName}-AdvisingInsightsTable
      AttributeDefinitions:
        - AttributeName: insightId
          AttributeType: S
        - AttributeName: advisorId
          AttributeType: S
      KeySchema:
        - AttributeName: insightId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: advisorId-index
          KeySchema:
            - AttributeName: advisorId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  AdvisingInsightTemplatesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      TableName: !Sub ${AWS::StackName}-AdvisingInsightTemplatesTable
      AttributeDefinitions:
        - AttributeName: templateKey
          AttributeType: S
      KeySchema:
        - AttributeName: templateKey
          KeyType: HASH

  AdvisingRulesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      TableName: !Sub ${AWS::StackName}-AdvisingRulesTable
      AttributeDefinitions:
        - AttributeName: ruleId
          AttributeType: S
        - AttributeName: advisorId
          AttributeType: S
      KeySchema:
        - AttributeName: ruleId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: advisorId-index
          KeySchema:
            - AttributeName: advisorId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  AdvisingConfigTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      TableName: !Sub ${AWS::StackName}-AdvisingConfigTable
      AttributeDefinitions:
        - AttributeName: configKey
          AttributeType: S
      KeySchema:
        - AttributeName: configKey
          KeyType: HASH

  # ── Student-scoped Lambda functions ─────────────────────────────────────────

  getAssignedAdvisorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/advising/advisor/
      Handler: index.handler
      Runtime: nodejs20.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 30
      Description: Return the student's assigned advisor based on assignment rules.
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AdvisingRulesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref StudentsTable
        - DynamoDBReadPolicy:
            TableName: !Ref ProfilesTable
      Environment:
        Variables:
          ADVISING_RULES_TABLE: !Ref AdvisingRulesTable
          STUDENTS_TABLE: !Ref StudentsTable
          PROFILES_TABLE: !Ref ProfilesTable
      Events:
        GetAdvisor:
          Type: Api
          Properties:
            Path: /advising/advisor
            Method: GET
            RestApiId: !Ref BackgroundChecksAPI
            Auth:
              Authorizer: MyCognitoAuth
              AuthorizationScopes:
                - com.apigw/advising.student
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - index.ts
        Minify: true
        Target: 'es2020'
        Sourcemap: true

  getAdvisorAvailabilityFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/advising/availability/_advisorId/
      Handler: index.handler
      Runtime: nodejs20.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 30
      Description: Return open slots for a given advisor in the next 2 weeks.
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AdvisingSlotsTable
      Environment:
        Variables:
          ADVISING_SLOTS_TABLE: !Ref AdvisingSlotsTable
      Events:
        GetAvailability:
          Type: Api
          Properties:
            Path: /advising/availability/advisor/{advisorId}
            Method: GET
            RestApiId: !Ref BackgroundChecksAPI
            Auth:
              Authorizer: MyCognitoAuth
              AuthorizationScopes:
                - com.apigw/advising.student
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - index.ts
        Minify: true
        Target: 'es2020'
        Sourcemap: true

  crudBookingFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/advising/bookings/
      Handler: index.handler
      Runtime: nodejs20.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 30
      Description: Book an advising slot (1/week limit, atomic conditional update).
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AdvisingSlotsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AdvisingConfigTable
      Environment:
        Variables:
          ADVISING_SLOTS_TABLE: !Ref AdvisingSlotsTable
          ADVISING_CONFIG_TABLE: !Ref AdvisingConfigTable
      Events:
        CreateBooking:
          Type: Api
          Properties:
            Path: /advising/bookings
            Method: POST
            RestApiId: !Ref BackgroundChecksAPI
            Auth:
              Authorizer: MyCognitoAuth
              AuthorizationScopes:
                - com.apigw/advising.student
        GetBookings:
          Type: Api
          Properties:
            Path: /advising/bookings
            Method: GET
            RestApiId: !Ref BackgroundChecksAPI
            Auth:
              Authorizer: MyCognitoAuth
              AuthorizationScopes:
                - com.apigw/advising.student
                - com.apigw/advising.advisor
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - index.ts
        Minify: true
        Target: 'es2020'
        Sourcemap: true

  cancelBookingFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/advising/bookings/_bookingId/
      Handler: index.handler
      Runtime: nodejs20.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 30
      Description: Cancel a student's booking (conditional update).
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AdvisingSlotsTable
      Environment:
        Variables:
          ADVISING_SLOTS_TABLE: !Ref AdvisingSlotsTable
      Events:
        CancelBooking:
          Type: Api
          Properties:
            Path: /advising/bookings/{bookingId}
            Method: DELETE
            RestApiId: !Ref BackgroundChecksAPI
            Auth:
              Authorizer: MyCognitoAuth
              AuthorizationScopes:
                - com.apigw/advising.student
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - index.ts
        Minify: true
        Target: 'es2020'
        Sourcemap: true

  # ── Advisor-scoped Lambda functions ─────────────────────────────────────────

  setAdvisorAvailabilityFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/advising/availability/_weekStartDate/
      Handler: index.handler
      Runtime: nodejs20.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 30
      Description: Bulk-create/replace advisor availability slots for a given week.
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AdvisingSlotsTable
      Environment:
        Variables:
          ADVISING_SLOTS_TABLE: !Ref AdvisingSlotsTable
      Events:
        SetAvailability:
          Type: Api
          Properties:
            Path: /advising/availability/week/{weekStartDate}
            Method: PUT
            RestApiId: !Ref BackgroundChecksAPI
            Auth:
              Authorizer: MyCognitoAuth
              AuthorizationScopes:
                - com.apigw/advising.advisor
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - index.ts
        Minify: true
        Target: 'es2020'
        Sourcemap: true

  getAdvisorSessionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/advising/sessions/
      Handler: index.handler
      Runtime: nodejs20.x
      Architectures:
